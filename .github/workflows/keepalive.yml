name: Keep Repo Active

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Update heartbeat file
        run: |
          mkdir -p .github
          echo "Last keepalive run: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/keepalive.txt

      - name: Commit and push heartbeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/keepalive.txt
          git commit -m "chore: keep repository active" || echo "No changes to commit"
          git push
